[package]
name = "crate-media-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = "1.5"
lofty = "0.22.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sentry = { version = "0.44.0", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "ureq"] }

[dev-dependencies]
tempfile = "3"
