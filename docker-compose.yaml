networks:
  crate:
    external: true

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  traefik:
    logging: *default-logging
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --log.filePath=
    security_opt:
      - "no-new-privileges:true"
    networks:
      - crate
    environment:
      - TZ=${TZ}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_DIR}/traefik/acme.json:/acme.json
      - ${DATA_DIR}/traefik/conf:/conf
      - ./deploy/traefik/federation-readplane.yml:/conf/crate-federation-readplane.yml:ro
      - ${DATA_DIR}/traefik/logs:/var/log/traefik
    labels:
      traefik.enable: true
      traefik.http.services.traefik.loadbalancer.server.port: 80
      traefik.http.routers.traefik-secure.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik-secure.entryPoints: websecure
      traefik.http.routers.traefik-secure.service: api@internal

  tidarr:
    logging: *default-logging
    image: cstaelen/tidarr:latest
    container_name: tidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Auth disabled — Crate handles access via Traefik middleware
      - ENABLE_BEETS=true
      - REACT_APP_TIDAL_COUNTRY_CODE=${TIDAL_COUNTRY_CODE:-ES}
    volumes:
      - ${DATA_DIR}/tidarr:/home/app/standalone/shared
      - ${MEDIA_DIR}/downloads/tidal/incomplete:/home/app/standalone/download/incomplete
      - ${MEDIA_DIR}/downloads/tidal/albums:/home/app/standalone/download/albums
      - ${MEDIA_DIR}/downloads/tidal/tracks:/home/app/standalone/download/tracks
      - ${MEDIA_DIR}/downloads/tidal/playlists:/home/app/standalone/download/playlists
      - ${MEDIA_DIR}/music:/home/app/standalone/library
      - ${MEDIA_DIR}/music:/music
      - ${MEDIA_DIR}/downloads/tidal/videos:/home/app/standalone/download/videos
    ports:
      - "${TIDARR_PORT}:8484"
    networks:
      - crate
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.tidarr.rule: Host(`search.${DOMAIN}`)
      traefik.http.routers.tidarr.entryPoints: websecure
      traefik.http.routers.tidarr.tls: true
      traefik.http.routers.tidarr.tls.certresolver: letsencrypt
      traefik.http.routers.tidarr.middlewares: crate-auth-soft@docker
      traefik.http.services.tidarr.loadbalancer.server.port: 8484
      traefik.http.services.tidarr.loadbalancer.server.scheme: http

  nginx:
    logging: *default-logging
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/nginx/html:/usr/share/nginx/html:ro
      - ${DATA_DIR}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${DATA_DIR}/nginx/logs:/var/log/nginx
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - crate
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.diego-ninja.rule: Host(`diego.ninja`)
      traefik.http.routers.diego-ninja.entryPoints: websecure
      traefik.http.services.diego-ninja.loadbalancer.server.port: 80
      traefik.http.routers.diego-ninja.middlewares: diego-ninja-headers
      traefik.http.middlewares.diego-ninja-headers.headers.customRequestHeaders.X-Forwarded-Proto: https
      traefik.http.middlewares.diego-ninja-headers.headers.customResponseHeaders.X-Frame-Options: SAMEORIGIN
      traefik.http.middlewares.diego-ninja-headers.headers.customResponseHeaders.X-Content-Type-Options: nosniff
      traefik.http.middlewares.diego-ninja-headers.headers.customResponseHeaders.Referrer-Policy: strict-origin-when-cross-origin
      traefik.http.routers.diego-ninja.tls: true
      traefik.http.routers.diego-ninja.tls.certresolver: letsencrypt

  # Soulseek client via slskd
  slskd:
    logging: *default-logging
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SHARED_DIR=/music
      - SLSKD_DOWNLOADS_DIR=/data/downloads/soulseek
      - SLSKD_INCOMPLETE_DIR=/data/downloads/soulseek/incomplete
      - SLSKD_WEB_AUTHENTICATION_API_KEYS_SOULSYNC=${SLSKD_API_KEY}
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_SOULSEEK_LISTEN_IP=0.0.0.0
      - SLSKD_SOULSEEK_LISTEN_PORT=${SLSKD_LISTEN_PORT}
    volumes:
      - ${DATA_DIR}/slskd:/app
      - ${MEDIA_DIR}/music:/music:ro
      - ${MEDIA_DIR}:/data
    ports:
      - "${SLSKD_PORT}:5030"
      - "${SLSKD_LISTEN_PORT}:${SLSKD_LISTEN_PORT}"
    networks:
      - crate
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.slskd.rule: Host(`soulseek.${DOMAIN}`)
      traefik.http.routers.slskd.entryPoints: websecure
      traefik.http.services.slskd.loadbalancer.server.port: 5030
      traefik.http.routers.slskd.tls: true
      traefik.http.routers.slskd.tls.certresolver: letsencrypt

  # Crate — Redis cache
  crate-redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: crate-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - crate_redis:/data
    networks:
      - crate

  # Durable coordination — broker, domain events, leases and job progress.
  crate-redis-durable:
    logging: *default-logging
    image: redis:7-alpine
    container_name: crate-redis-durable
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - crate_redis_durable:/data
    networks:
      - crate

  # Crate — PostgreSQL database
  # POSTGRES_USER/PASSWORD/DB only take effect on first volume init.
  # The app connects using CRATE_POSTGRES_* vars from .env.
  # These MUST match an existing role in the volume, or the init script
  # must create one. See app/scripts/init-postgres.sh for provisioning.
  crate-postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg15
    container_name: crate-postgres
    restart: unless-stopped
    mem_limit: 1g
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER_USER:-crate}"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - POSTGRES_USER=${POSTGRES_SUPERUSER_USER:-crate}
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD:-crate}
      - POSTGRES_DB=${POSTGRES_SUPERUSER_DB:-crate}
    volumes:
      - crate_postgres:/var/lib/postgresql/data
    networks:
      - crate

  # Crate — PostgreSQL backups
  crate-postgres-backup:
    logging: *default-logging
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: crate-postgres-backup
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=crate-postgres
      - POSTGRES_DB=${CRATE_POSTGRES_DB}
      - POSTGRES_USER=${CRATE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${CRATE_POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
    volumes:
      - ${DATA_DIR}/backups/postgres:/backups
    networks:
      - crate
    depends_on:
      - crate-postgres

  # Crate — Music stack management
  crate-api:
    logging: *default-logging
    image: ${CRATE_API_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-api:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app
      target: api
    container_name: crate-api
    restart: unless-stopped
    user: ${PUID}:${PGID}
    group_add:
      - "${DOCKER_GID:-988}"
    environment:
      - TZ=${TZ}
      - CRATE_RUNTIME=api
      - CRATE_CONFIG=/app/config.yaml
      - DATA_DIR=/data
      - CACHE_DIR=/cache
      - TIDAL_COUNTRY_CODE=${TIDAL_COUNTRY_CODE:-ES}
      - CRATE_BANDCAMP_WEB_CREDENTIAL_BRIDGE_ENABLED=${CRATE_BANDCAMP_WEB_CREDENTIAL_BRIDGE_ENABLED:-false}
      - CRATE_BANDCAMP_CREDENTIAL_BRIDGE_BACKEND=${CRATE_BANDCAMP_CREDENTIAL_BRIDGE_BACKEND:-browser}
      - CRATE_BANDCAMP_CREDENTIAL_BRIDGE_COMMAND=${CRATE_BANDCAMP_CREDENTIAL_BRIDGE_COMMAND:-}
      - CRATE_BANDCAMP_CREDENTIAL_BRIDGE_TIMEOUT=${CRATE_BANDCAMP_CREDENTIAL_BRIDGE_TIMEOUT:-120}
      - LASTFM_APIKEY=${LASTFM_APIKEY}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
      - DOMAIN=${DOMAIN}
      - CRATE_INSTANCE_NAME=${CRATE_INSTANCE_NAME:?CRATE_INSTANCE_NAME must be set}
      - CRATE_PUBLIC_API_BASE_URL=${CRATE_PUBLIC_API_BASE_URL:?CRATE_PUBLIC_API_BASE_URL must be set}
      - SPOTIFY_ID=${SPOTIFY_ID}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET}
      - SETLISTFM_API_KEY=${SETLISTFM_API_KEY}
      - SETLISTFM_SHOWS_SYNC_ENABLED=${SETLISTFM_SHOWS_SYNC_ENABLED:-false}
      - SETLISTFM_SHOWS_SYNC_MAX_ARTISTS=${SETLISTFM_SHOWS_SYNC_MAX_ARTISTS:-100}
      - CRATE_POSTGRES_USER=${CRATE_POSTGRES_USER}
      - CRATE_POSTGRES_PASSWORD=${CRATE_POSTGRES_PASSWORD}
      - CRATE_POSTGRES_DB=${CRATE_POSTGRES_DB}
      - CRATE_POSTGRES_HOST=crate-postgres
      - CRATE_SQLALCHEMY_POOL_TIMEOUT_SECONDS=${CRATE_SQLALCHEMY_POOL_TIMEOUT_SECONDS:-5}
      - CRATE_POSTGRES_CONNECT_TIMEOUT_SECONDS=${CRATE_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      - CRATE_POSTGRES_STATEMENT_TIMEOUT_MS=${CRATE_API_POSTGRES_STATEMENT_TIMEOUT_MS:-15000}
      - CRATE_POSTGRES_LOCK_TIMEOUT_MS=${CRATE_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      - POSTGRES_SUPERUSER_USER=${POSTGRES_SUPERUSER_USER:-crate}
      - POSTGRES_SUPERUSER_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD:-crate}
      - POSTGRES_SUPERUSER_DB=${POSTGRES_SUPERUSER_DB:-crate}
      - JWT_SECRET=${JWT_SECRET}
      - CRATE_FEDERATION_SUBJECT_SECRET=${CRATE_FEDERATION_SUBJECT_SECRET:?CRATE_FEDERATION_SUBJECT_SECRET must be set}
      - CRATE_FEDERATION_CURSOR_SECRET=${CRATE_FEDERATION_CURSOR_SECRET:?CRATE_FEDERATION_CURSOR_SECRET must be set}
      - CRATE_FEDERATION_CATALOG_PAGE_MAX_BYTES=${CRATE_FEDERATION_CATALOG_PAGE_MAX_BYTES:-2097152}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NATIVE_OAUTH_EXCHANGE_ENABLED=${NATIVE_OAUTH_EXCHANGE_ENABLED:-false}
      - NATIVE_OAUTH_LEGACY_REDIRECT_ENABLED=${NATIVE_OAUTH_LEGACY_REDIRECT_ENABLED:-true}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUDIOMUSE_GEMINI_API_KEY=${AUDIOMUSE_GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@crate-redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@crate-redis:6379/0}
      - REDIS_DURABLE_URL=${REDIS_DURABLE_URL:-redis://:${REDIS_PASSWORD}@crate-redis-durable:6379/0}
      - CRATE_METRICS_REDIS_TTL_SECONDS=${CRATE_METRICS_REDIS_TTL_SECONDS:-86400}
      - CRATE_SSE_REDIS_MAX_CONNECTIONS=${CRATE_SSE_REDIS_MAX_CONNECTIONS:-128}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - DISCOGS_CONSUMER_KEY=${DISCOGS_CONSUMER_KEY:-}
      - DISCOGS_CONSUMER_SECRET=${DISCOGS_CONSUMER_SECRET:-}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      - CRATE_MEDIA_WORKER_URL=http://crate-media-worker:8687
      - CRATE_MEDIA_WORKER_MAX_ACTIVE=${CRATE_MEDIA_WORKER_MAX_ACTIVE:-1}
      - CRATE_READPLANE_SERVICE_TOKEN=${CRATE_READPLANE_SERVICE_TOKEN:?CRATE_READPLANE_SERVICE_TOKEN must be set}
      - CRATE_FEDERATION_IMPORT_MAX_BYTES=${CRATE_FEDERATION_IMPORT_MAX_BYTES:-100000000000}
      - CRATE_FEDERATION_IMPORT_PEER_RESERVED_BYTES=${CRATE_FEDERATION_IMPORT_PEER_RESERVED_BYTES:-100000000000}
      - CRATE_FEDERATION_IMPORT_GLOBAL_RESERVED_BYTES=${CRATE_FEDERATION_IMPORT_GLOBAL_RESERVED_BYTES:-250000000000}
      - CRATE_FEDERATION_IMPORT_FREE_HEADROOM_BYTES=${CRATE_FEDERATION_IMPORT_FREE_HEADROOM_BYTES:-10737418240}
      - CRATE_FEDERATION_IMPORT_LEASE_SECONDS=${CRATE_FEDERATION_IMPORT_LEASE_SECONDS:-18000}
    volumes:
      - ./app/config.yaml:/app/config.yaml:ro
      - ${MEDIA_DIR}/music:/music:ro
      - ${DATA_DIR}/crate:/data
      - ${CACHE_DIR:-./data/cache}:/cache:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crate
    depends_on:
      - crate-postgres
      - crate-redis
      - crate-redis-durable
      - crate-media-worker
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8585/api/status', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.crate-api.rule: Host(`api.${DOMAIN}`)
      traefik.http.routers.crate-api.entryPoints: websecure
      traefik.http.routers.crate-api.middlewares: crate-api-compress@docker
      traefik.http.services.crate-api.loadbalancer.server.port: 8585
      traefik.http.routers.crate-api.tls: true
      traefik.http.routers.crate-api.tls.certresolver: letsencrypt
      traefik.http.middlewares.crate-api-compress.compress: true
      traefik.http.middlewares.crate-api-compress.compress.encodings: gzip,br
      traefik.http.middlewares.crate-api-compress.compress.minResponseBodyBytes: 1024
      traefik.http.middlewares.crate-api-compress.compress.excludedContentTypes: text/event-stream,audio/mpeg,audio/flac,audio/x-flac,audio/mp4,audio/aac,audio/ogg,video/mp4,application/octet-stream,application/zip,application/x-zip-compressed,image/jpeg,image/png,image/webp,image/avif
    command: ["api"]

  crate-readplane:
    logging: *default-logging
    image: ${CRATE_READPLANE_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-readplane:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app/readplane
    container_name: crate-readplane
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - READPLANE_ADDR=:8686
      - CRATE_POSTGRES_USER=${CRATE_POSTGRES_USER}
      - CRATE_POSTGRES_PASSWORD=${CRATE_POSTGRES_PASSWORD}
      - CRATE_POSTGRES_DB=${CRATE_POSTGRES_DB}
      - CRATE_POSTGRES_HOST=crate-postgres
      - CRATE_POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@crate-redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@crate-redis:6379/0}
      - REDIS_DURABLE_URL=${REDIS_DURABLE_URL:-redis://:${REDIS_PASSWORD}@crate-redis-durable:6379/0}
      - JWT_SECRET=${JWT_SECRET}
      - READPLANE_ENABLED=${READPLANE_ENABLED:-true}
      - READPLANE_ENABLE_SSE=${READPLANE_ENABLE_SSE:-true}
      - READPLANE_ROUTE_MODE=${READPLANE_ROUTE_MODE:-active}
      - READPLANE_FALLBACK_ENABLED=${READPLANE_FALLBACK_ENABLED:-true}
      - READPLANE_FALLBACK_TIMEOUT_MS=${READPLANE_FALLBACK_TIMEOUT_MS:-3000}
      - READPLANE_FALLBACK_FAILURE_THRESHOLD=${READPLANE_FALLBACK_FAILURE_THRESHOLD:-5}
      - READPLANE_FALLBACK_OPEN_SECONDS=${READPLANE_FALLBACK_OPEN_SECONDS:-10}
      - READPLANE_FEDERATION_PROXY_ENABLED=${READPLANE_FEDERATION_PROXY_ENABLED:-true}
      - CRATE_READPLANE_SERVICE_TOKEN=${CRATE_READPLANE_SERVICE_TOKEN:?CRATE_READPLANE_SERVICE_TOKEN must be set}
      - READPLANE_FEDERATION_CONTROL_TIMEOUT_MS=${READPLANE_FEDERATION_CONTROL_TIMEOUT_MS:-2000}
      - READPLANE_FEDERATION_CONNECT_TIMEOUT_MS=${READPLANE_FEDERATION_CONNECT_TIMEOUT_MS:-5000}
      - READPLANE_FEDERATION_HEADER_TIMEOUT_MS=${READPLANE_FEDERATION_HEADER_TIMEOUT_MS:-10000}
      - API_FALLBACK_BASE=http://crate-api:8585
      - READPLANE_MAX_DB_CONNS=${READPLANE_MAX_DB_CONNS:-8}
      - READPLANE_MIN_DB_CONNS=${READPLANE_MIN_DB_CONNS:-1}
      - READPLANE_QUERY_TIMEOUT_MS=${READPLANE_QUERY_TIMEOUT_MS:-800}
      - READPLANE_SNAPSHOT_MAX_AGE_SECONDS=${READPLANE_SNAPSHOT_MAX_AGE_SECONDS:-600}
      - READPLANE_STALE_MAX_AGE_SECONDS=${READPLANE_STALE_MAX_AGE_SECONDS:-3600}
      - READPLANE_STATS_SNAPSHOT_MAX_AGE_SECONDS=${READPLANE_STATS_SNAPSHOT_MAX_AGE_SECONDS:-300}
      - READPLANE_STATS_STALE_MAX_AGE_SECONDS=${READPLANE_STATS_STALE_MAX_AGE_SECONDS:-86400}
      - READPLANE_SESSION_TOUCH_INTERVAL_SECONDS=${READPLANE_SESSION_TOUCH_INTERVAL_SECONDS:-60}
      - READPLANE_AUTH_CACHE_TTL_SECONDS=${READPLANE_AUTH_CACHE_TTL_SECONDS:-15}
      - READPLANE_AUTH_CACHE_MAX_ENTRIES=${READPLANE_AUTH_CACHE_MAX_ENTRIES:-2048}
      - READPLANE_LOCAL_MEDIA_ENABLED=${READPLANE_LOCAL_MEDIA_ENABLED:-false}
      - READPLANE_MUSIC_ROOT=/music
      - READPLANE_CACHE_ROOT=/cache
      - DOMAIN=${DOMAIN}
      - CRATE_CORS_EXTRA_ORIGINS=${CRATE_CORS_EXTRA_ORIGINS:-}
    volumes:
      - ${MUSIC_DIR}:/music:ro
      - ${CACHE_DIR:-./data/cache}:/cache:ro
    networks:
      - crate
    depends_on:
      - crate-postgres
      - crate-redis
      - crate-redis-durable
      - crate-api
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "/crate-readplane", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.crate-readplane-interactive.rule: Host(`api.${DOMAIN}`) && (Method(`GET`) || Method(`HEAD`)) && (PathPrefix(`/api/catalog/`) || PathPrefix(`/api/me/home/`) || PathPrefix(`/api/me/albums`) || PathPrefix(`/api/me/follows`) || PathPrefix(`/api/genres`) || PathPrefix(`/api/artists/`) || PathPrefix(`/api/artist-slugs/`) || PathPrefix(`/api/albums/`) || Path(`/api/auth/me`) || Path(`/api/me`) || Path(`/api/me/history`) || Path(`/api/me/likes`) || Path(`/api/me/stats/dashboard`) || Path(`/api/search`) || Path(`/api/favorites`))
      traefik.http.routers.crate-readplane-interactive.entryPoints: websecure
      traefik.http.routers.crate-readplane-interactive.middlewares: crate-api-compress@docker
      traefik.http.routers.crate-readplane-interactive.priority: 100
      traefik.http.routers.crate-readplane-interactive.service: crate-readplane-interactive@file
      traefik.http.routers.crate-readplane-interactive.tls: true
      traefik.http.routers.crate-readplane-interactive.tls.certresolver: letsencrypt
