      - CRATE_RESOURCE_MAX_LOAD_RATIO=${CRATE_RESOURCE_MAX_LOAD_RATIO:-0.85}
      - CRATE_RESOURCE_MAX_IOWAIT_PERCENT=${CRATE_RESOURCE_MAX_IOWAIT_PERCENT:-25}
      - CRATE_RESOURCE_MAX_SWAP_PERCENT=${CRATE_RESOURCE_MAX_SWAP_PERCENT:-30}
      - CRATE_RESOURCE_MIN_SWAP_USED_MB=${CRATE_RESOURCE_MIN_SWAP_USED_MB:-512}
      - CRATE_RESOURCE_MIN_MEMORY_AVAILABLE_PERCENT=${CRATE_RESOURCE_MIN_MEMORY_AVAILABLE_PERCENT:-15}
      - CRATE_RESOURCE_MAX_ACTIVE_USERS=${CRATE_RESOURCE_MAX_ACTIVE_USERS:-0}
      - CRATE_RESOURCE_MAX_ACTIVE_STREAMS=${CRATE_RESOURCE_MAX_ACTIVE_STREAMS:-0}
      - CRATE_RESOURCE_DEFER_SECONDS=${CRATE_RESOURCE_DEFER_SECONDS:-300}
      - CRATE_MAINTENANCE_WINDOW_ENABLED=${CRATE_MAINTENANCE_WINDOW_ENABLED:-true}
      - CRATE_MAINTENANCE_WINDOW_START=${CRATE_MAINTENANCE_WINDOW_START:-02:00}
      - CRATE_MAINTENANCE_WINDOW_END=${CRATE_MAINTENANCE_WINDOW_END:-07:00}
      - CRATE_MAINTENANCE_WINDOW_FINGERPRINT_LIMIT=${CRATE_MAINTENANCE_WINDOW_FINGERPRINT_LIMIT:-1000}
      - CRATE_LEGACY_POOL_MAXCONN=${ANALYSIS_LEGACY_POOL_MAXCONN:-2}
      - CRATE_SQLALCHEMY_POOL_SIZE=${ANALYSIS_SQLALCHEMY_POOL_SIZE:-1}
      - CRATE_SQLALCHEMY_MAX_OVERFLOW=${ANALYSIS_SQLALCHEMY_MAX_OVERFLOW:-1}
    volumes:
      - ./app/config.yaml:/app/config.yaml:ro
      - ${MEDIA_DIR}/music:/music:ro
      - ${DATA_DIR}/crate:/data
    networks:
      - crate
    depends_on:
      - crate-postgres
      - crate-redis
      - crate-redis-durable
    mem_limit: 2g
    mem_reservation: 768m
    cpus: "0.75"
    command:
      [
        "worker",
        "--queues",
        "heavy",
        "--processes",
        "${ANALYSIS_WORKER_PROCESSES:-1}",
        "--no-service-loop",
        "--no-projector",
        "--no-telegram",
      ]

  crate-playback-worker:
    logging: *default-logging
    image: ${CRATE_PLAYBACK_WORKER_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-playback-worker:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app
      target: worker-playback
    container_name: crate-playback-worker
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - CRATE_RUNTIME=worker
      - CRATE_POSTGRES_STATEMENT_TIMEOUT_MS=${CRATE_WORKER_POSTGRES_STATEMENT_TIMEOUT_MS:-900000}
      - CRATE_CONFIG=/app/config.yaml
      - DATA_DIR=/data
      - CACHE_DIR=/cache
      - TIDAL_COUNTRY_CODE=${TIDAL_COUNTRY_CODE:-ES}
      - DOMAIN=${DOMAIN}
      - CRATE_FEDERATION_SUBJECT_SECRET=${CRATE_FEDERATION_SUBJECT_SECRET:?CRATE_FEDERATION_SUBJECT_SECRET must be set}
      - CRATE_POSTGRES_USER=${CRATE_POSTGRES_USER}
      - CRATE_POSTGRES_PASSWORD=${CRATE_POSTGRES_PASSWORD}
      - CRATE_POSTGRES_DB=${CRATE_POSTGRES_DB}
      - CRATE_POSTGRES_HOST=crate-postgres
      - POSTGRES_SUPERUSER_USER=${POSTGRES_SUPERUSER_USER:-crate}
      - POSTGRES_SUPERUSER_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD:-crate}
      - POSTGRES_SUPERUSER_DB=${POSTGRES_SUPERUSER_DB:-crate}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - OMP_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - OPENBLAS_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - MKL_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - NUMEXPR_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - VECLIB_MAXIMUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - TORCH_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - NUMBA_NUM_THREADS=${PLAYBACK_NATIVE_THREADS:-1}
      - CRATE_FFMPEG_THREADS=${PLAYBACK_FFMPEG_THREADS:-1}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@crate-redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@crate-redis:6379/0}
      - REDIS_DURABLE_URL=${REDIS_DURABLE_URL:-redis://:${REDIS_PASSWORD}@crate-redis-durable:6379/0}
      - CRATE_METRICS_REDIS_TTL_SECONDS=${CRATE_METRICS_REDIS_TTL_SECONDS:-86400}
      - CRATE_STREAM_TRANSCODE_MAX_CONCURRENT=${STREAM_TRANSCODE_MAX_CONCURRENT:-1}
      - CRATE_LEGACY_POOL_MAXCONN=${PLAYBACK_LEGACY_POOL_MAXCONN:-2}
      - CRATE_SQLALCHEMY_POOL_SIZE=${PLAYBACK_SQLALCHEMY_POOL_SIZE:-1}
      - CRATE_SQLALCHEMY_MAX_OVERFLOW=${PLAYBACK_SQLALCHEMY_MAX_OVERFLOW:-1}
    volumes:
      - ./app/config.yaml:/app/config.yaml:ro
      - ${MEDIA_DIR}/music:/music:ro
      - ${DATA_DIR}/crate:/data
      - ${CACHE_DIR:-./data/cache}:/cache
    networks:
      - crate
    depends_on:
      - crate-postgres
      - crate-redis
      - crate-redis-durable
    mem_limit: 1g
    mem_reservation: 384m
    cpus: "1.0"
    command:
      [
        "worker",
        "--queues",
        "playback",
        "--processes",
        "${PLAYBACK_WORKER_PROCESSES:-1}",
        "--no-service-loop",
        "--no-daemons",
        "--no-projector",
        "--no-telegram",
      ]

  crate-media-worker:
    logging: *default-logging
    image: ${CRATE_MEDIA_WORKER_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-media-worker:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app
      target: media-worker
    container_name: crate-media-worker
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - DATA_DIR=/data
      - CRATE_MEDIA_WORKER_ADDR=0.0.0.0:8687
      - REDIS_URL=${REDIS_DURABLE_URL:-redis://:${REDIS_PASSWORD}@crate-redis-durable:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@crate-redis:6379/0}
      - REDIS_DURABLE_URL=${REDIS_DURABLE_URL:-redis://:${REDIS_PASSWORD}@crate-redis-durable:6379/0}
    volumes:
      - ${MEDIA_DIR}/music:/music:ro
      - ${DATA_DIR}/crate:/data
    networks:
      - crate
    depends_on:
      - crate-redis
      - crate-redis-durable
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.25"

  crate-ui:
    logging: *default-logging
    image: ${CRATE_UI_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-ui:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app
      dockerfile: ui/Dockerfile
    container_name: crate-ui
    restart: unless-stopped
    depends_on:
      - crate-api
    networks:
      - crate
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.admin.rule: Host(`admin.${DOMAIN}`)
      traefik.http.routers.admin.entryPoints: websecure
      traefik.http.services.admin.loadbalancer.server.port: 80
      traefik.http.routers.admin.tls: true
      traefik.http.routers.admin.tls.certresolver: letsencrypt

  crate-listen:
    logging: *default-logging
    image: ${CRATE_LISTEN_IMAGE:-${CRATE_IMAGE_REGISTRY:-ghcr.io}/${CRATE_IMAGE_OWNER:-thecrateapp}/crate-listen:${CRATE_IMAGE_TAG:-latest}}
    build:
      context: ./app
      dockerfile: listen/Dockerfile
    container_name: crate-listen
    restart: unless-stopped
    depends_on:
      - crate-api
      - crate-readplane
    networks:
      - crate
    labels:
      traefik.enable: true
      traefik.docker.network: crate
      traefik.http.routers.listen.rule: Host(`listen.${DOMAIN}`)
      traefik.http.routers.listen.entryPoints: websecure
      traefik.http.services.listen.loadbalancer.server.port: 80
      traefik.http.routers.listen.tls: true
      traefik.http.routers.listen.tls.certresolver: letsencrypt
      # Forward-auth middlewares (used by other services)
      traefik.http.middlewares.crate-auth.forwardAuth.address: http://crate-api:8585/api/auth/verify
      traefik.http.middlewares.crate-auth.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.crate-auth.forwardAuth.authResponseHeaders: Remote-User,Remote-Name,Remote-Role
      traefik.http.middlewares.crate-auth-soft.forwardAuth.address: http://crate-api:8585/api/auth/verify-soft
      traefik.http.middlewares.crate-auth-soft.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.crate-auth-soft.forwardAuth.authResponseHeaders: Remote-User,Remote-Name,Remote-Role

volumes:
  crate_redis:
    driver: local
  crate_redis_durable:
    driver: local
  crate_postgres:
    driver: local
