name: Readplane Tests

on:
  push:
    branches: [main]
    paths:
      - "app/readplane/**"
      - "app/tests/load/*media*"
      - ".github/workflows/test-readplane.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/readplane/**"
      - "app/tests/load/*media*"
      - ".github/workflows/test-readplane.yml"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Go test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/app/readplane:/src" \
            -w /src \
            golang:1.23-alpine \
            go test ./...

      - name: Go vet
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/app/readplane:/src" \
            -w /src \
            golang:1.23-alpine \
            go vet ./...

      - name: Native media race tests
        run: |
          docker run --rm \
            -e CGO_ENABLED=1 \
            -v "${{ github.workspace }}/app/readplane:/src" \
            -w /src \
            golang:1.23 \
            go test -race ./internal/media ./internal/observability ./internal/routes

      - name: Build readplane image
        uses: docker/build-push-action@v7
        with:
          context: ./app/readplane
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
          tags: crate-readplane:ci
