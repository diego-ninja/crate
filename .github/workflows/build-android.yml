name: Build Android

# Pull requests, main pushes, and manual dispatches validate the mobile app.
# Only tag pushes build and publish signed, shrunk end-user artifacts.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-android.yml"
      - "app/listen/**"
      - "app/shared/**"
      - "package-lock.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/build-android.yml"
      - "app/listen/**"
      - "app/shared/**"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      CRATE_MOBILE_RELEASE: "true"
    permissions:
      contents: write # create/update releases
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Java (required by Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck Listen
        run: npm run typecheck
        working-directory: app/listen

      - name: Lint Listen
        run: npm run lint
        working-directory: app/listen

      - name: Test mobile contracts
        run: >-
          npm run test -- --run
          src/lib/capacitor.test.ts
          src/lib/android-native-engine.test.ts
          src/lib/offline-native.test.ts
          src/lib/native-media-session.test.ts
          src/lib/native-secure-session.test.ts
          src/lib/media-access.test.ts
          src/lib/native-output-router.test.ts
          src/contexts/use-media-session.test.tsx
        working-directory: app/listen

      - name: Test mobile build scripts
        run: node --test scripts/*.test.mjs
        working-directory: app/listen

      - name: Validate secure release configuration
        run: node scripts/assert-release-mobile-config.mjs
        working-directory: app/listen

      - name: Build web bundle (capacitor mode)
        run: npm run build:cap
        working-directory: app/listen

      - name: Enforce mobile bundle budget
        run: npm run check:bundle
        working-directory: app/listen

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: app/listen/android

      - name: Lint Android
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: app/listen/android

      - name: Test Android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: app/listen/android

      - name: Resolve Android release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/android-release-version.mjs "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
        working-directory: app/listen

      - name: Prepare Android signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_KEYSTORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/crate-release.jks"
          test -s "$RUNNER_TEMP/crate-release.jks"

      - name: Build signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CRATE_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/crate-release.jks
          CRATE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          CRATE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CRATE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease lintRelease --no-daemon
        working-directory: app/listen/android

      - name: Locate Android release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        id: locate
        run: |
          APK_PATH=$(find app/listen/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          AAB_PATH=$(find app/listen/android/app/build/outputs/bundle/release -name '*.aab' | head -n1)
          test -n "$APK_PATH"
          test -n "$AAB_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APK_PATH" "$AAB_PATH"

      - name: Prepare published release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        id: rename
        run: |
          SAFE_TAG_NAME=$(printf '%s' "$GITHUB_REF_NAME" | sed 's#[^A-Za-z0-9._-]#-#g')
          test -n "$SAFE_TAG_NAME"
          APK_DEST="crate-${SAFE_TAG_NAME}.apk"
          AAB_DEST="crate-${SAFE_TAG_NAME}.aab"
          cp "${{ steps.locate.outputs.apk_path }}" "$APK_DEST"
          cp "${{ steps.locate.outputs.aab_path }}" "$AAB_DEST"
          cp "$APK_DEST" "crate.apk"
          echo "apk_dest=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "aab_dest=$AAB_DEST" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.apk_dest }}
          path: ${{ steps.rename.outputs.apk_dest }}
          retention-days: 30

      - name: Upload release bundle and R8 outputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: crate-android-release-${{ github.ref_name }}
          path: |
            ${{ steps.rename.outputs.aab_dest }}
            app/listen/android/app/build/outputs/mapping/release/
            app/listen/android/app/build/outputs/native-debug-symbols/release/
          if-no-files-found: error
          retention-days: 90

      - name: Attach signed Android artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.rename.outputs.apk_dest }}
            ${{ steps.rename.outputs.aab_dest }}
            crate.apk
          body: |
            ## Crate — ${{ github.ref_name }}

            **Signed release APK and Android App Bundle.** The APK is minified
            and resource-shrunk. Install requires "Install from
            unknown sources" / "Install unknown apps" enabled for your
            browser or file manager.

            On first launch the app will prompt for the URL of your
            Crate server. Point it at your instance (e.g.
            `https://api.your-host.com`), sign in, and you're in.

            This is a **beta build**. Report issues at
            https://github.com/thecrateapp/crate/issues.
